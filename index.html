<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Random user</h1>
    <div id="user"></div>
    <button onclick="getUser()">Pick a random user</button>
    <script>
      const randomUser = document.getElementById('user');

      async function getUser() {
        try {
          const response = await fetch('https://randomuser.me/api/');
          const data = await response.json();
          const result = data.results[0];
          randomUser.innerHTML = `<img src="${result.picture.medium}"/><h1>${result.name.title}. ${result.name.first} ${result.name.last}</h1>`;
        } catch (error) {
          console.log(error);
        }
      }
    </script>
  </body>
</html>
